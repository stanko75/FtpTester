<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FTP Tester</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/site.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-semibold">FTP / FTPS / SFTP Tester</span>
      <span class="navbar-text text-white-50">Azure App Service ready</span>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="row g-4">
      <section class="col-12 col-xl-4">
        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold">1. Connection Settings</div>
          <div class="card-body">
            <form id="connectionForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="protocol">Protocol</label>
                <select id="protocol" class="form-select" required>
                  <option value="Ftp">FTP</option>
                  <option value="Ftps">FTPS</option>
                  <option value="Sftp">SFTP</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="port">Port</label>
                <input id="port" type="number" min="1" max="65535" class="form-control" value="21" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="host">Host</label>
                <input id="host" class="form-control" maxlength="255" placeholder="ftp.example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="username">Username</label>
                <input id="username" class="form-control" autocomplete="username" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="password">Password</label>
                <input id="password" type="password" class="form-control" autocomplete="current-password" required>
              </div>
              <div class="col-12 form-check ms-2">
                <input id="passiveMode" class="form-check-input" type="checkbox" checked>
                <label class="form-check-label" for="passiveMode">Passive Mode for FTP/FTPS</label>
              </div>
              <div class="col-12 d-grid">
                <button id="connectBtn" class="btn btn-primary" type="button">Connect</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm mt-4">
          <div class="card-header bg-white fw-semibold">Saved Test History</div>
          <div class="card-body">
            <button id="refreshHistoryBtn" class="btn btn-outline-secondary btn-sm mb-3" type="button">Refresh history</button>
            <div id="history" class="small"></div>
          </div>
        </div>
      </section>

      <section class="col-12 col-xl-8">
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white fw-semibold">2. File Operations</div>
          <div class="card-body">
            <div id="alerts"></div>
            <div class="row g-3 align-items-end">
              <div class="col-lg-5">
                <label class="form-label" for="uploadFile">Upload file</label>
                <input id="uploadFile" type="file" class="form-control">
              </div>
              <div class="col-lg-5">
                <label class="form-label" for="uploadRemotePath">Remote upload path</label>
                <input id="uploadRemotePath" class="form-control" placeholder="/uploads/file.bin">
              </div>
              <div class="col-lg-2 d-grid">
                <button id="uploadBtn" class="btn btn-success" type="button">Upload</button>
              </div>

              <div class="col-lg-10">
                <label class="form-label" for="remotePath">Remote path</label>
                <input id="remotePath" class="form-control" placeholder="/remote/path">
              </div>
              <div class="col-lg-2 d-grid gap-2">
                <button id="downloadBtn" class="btn btn-outline-primary" type="button">Download</button>
              </div>
              <div class="col-lg-6 d-grid">
                <button id="listBtn" class="btn btn-outline-secondary" type="button">List Directory</button>
              </div>
              <div class="col-lg-6 d-grid">
                <button id="deleteBtn" class="btn btn-outline-danger" type="button">Delete File</button>
              </div>
            </div>
            <div class="progress mt-3 d-none" id="progressContainer" role="progressbar" aria-label="Transfer progress">
              <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white fw-semibold">3. Benchmark Results</div>
          <div class="card-body">
            <div class="row g-3 align-items-end mb-3">
              <div class="col-md-6">
                <label class="form-label" for="benchmarkDirectory">Benchmark remote directory</label>
                <input id="benchmarkDirectory" class="form-control" value="/">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="benchmarkSize">Payload size (bytes)</label>
                <input id="benchmarkSize" type="number" min="1024" max="104857600" class="form-control" value="1048576">
              </div>
              <div class="col-md-2 d-grid">
                <button id="benchmarkBtn" class="btn btn-warning" type="button">Benchmark</button>
              </div>
            </div>
            <div class="row g-3" id="metrics">
              <div class="col-md-4"><div class="card metric-card"><div class="card-body"><div class="text-muted">Duration</div><div id="durationMetric" class="fs-4">—</div></div></div></div>
              <div class="col-md-4"><div class="card metric-card"><div class="card-body"><div class="text-muted">Transfer speed</div><div id="speedMetric" class="fs-4">—</div></div></div></div>
              <div class="col-md-4"><div class="card metric-card"><div class="card-body"><div class="text-muted">Status</div><div id="statusMetric" class="fs-4">—</div></div></div></div>
            </div>
            <pre id="resultJson" class="json bg-light border rounded p-3 mt-3 mb-0"></pre>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white fw-semibold">4. Logs</div>
          <div class="card-body p-0">
            <div id="logs" class="log-window rounded-bottom"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
